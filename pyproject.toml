[project]
name = "soc-threat-hunting-zeek"
version = "0.2.0"
description = "Hypothesis-driven beaconing hunt on Zeek conn telemetry using inter-arrival periodicity and analyst validation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
